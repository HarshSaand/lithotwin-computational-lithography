[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="lithotwin-computational-lithography"
version="1.0.0"
description="Conditional neural surrogate for reduced-order computational lithography"
requires-python=">=3.10"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
